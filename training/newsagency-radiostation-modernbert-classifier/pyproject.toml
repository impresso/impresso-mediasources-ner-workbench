[project]
name = "mediaagency-modernbert"
version = "0.1.0"
description = "ModernBERT token-classification training for Impresso media sources"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.1.0",
  "datasets",
  "torch",
  "transformers",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
